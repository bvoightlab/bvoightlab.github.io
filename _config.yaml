# site properties and page defaults
title: Voight Lab
subtitle: Univeresity of Pennsylvania
description: Human Statistical Genetics and Population Genetics Lab at the University of Pennsylvania.
header: images/background.jpg
footer: images/background.jpg


# site social media and other links
links:
  email: bvoight28@gmail.com
  orcid: 0000-0002-6205-9994
  google-scholar: FexB61cAAAAJ
  github: bvoightlab
  twitter: bvoight28
  #youtube: bvoightlab

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
